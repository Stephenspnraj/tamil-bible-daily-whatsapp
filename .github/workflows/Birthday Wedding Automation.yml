name: Birthday Wedding Automation

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 2 AM UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install gspread oauth2client requests

    - name: Create service account file
      run: echo "${{ secrets.GOOGLE_CREDENTIALS }}" > service_account.json

    - name: Run Python script
      env:
        WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
        MY_WHATSAPP_NUMBER: ${{ secrets.MY_WHATSAPP_NUMBER }}
      run: python send_messages.py
